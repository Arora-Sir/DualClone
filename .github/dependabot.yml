version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: quarterly
    # NOTE: A release has to be at least a week old before Dependabot proposes it, so a bad release can be pulled upstream first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [ minor, patch ]
    ignore:
      # NOTE: Major jumps such as AGP 9 or a new compileSdk need a planned migration, not an automatic pull request.
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    # NOTE: One pull request for all workflow action bumps instead of one per action.
    groups:
      actions:
        patterns: [ "*" ]
