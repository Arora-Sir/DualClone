name: Feature Request
description: Propose a new feature, improvement, or idea for DualClone.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement for DualClone.
  - type: textarea
    id: proposal
    attributes:
      label: Feature Proposal
      description: Provide a clear and concise description of the proposed feature.
      placeholder: Describe the capability you would like added.
    validations:
      required: true
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement or Use Case
      description: Explain the problem this feature solves or the workflow it improves.
      placeholder: Explain what problem occurs without this feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features considered.
      placeholder: Describe any workarounds or alternative approaches explored.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or Samsung One UI specific behavior.
      placeholder: Add extra details or device context.
    validations:
      required: false
